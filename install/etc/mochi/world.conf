# Mochi world server configuration
# After editing, run 'systemctl restart mochi-world'
# See mochi-world(8) for full details.

[world]
# Set both of these before turning public on: an unnamed server refuses to
# publish, and a server with no [transport] address would publish the loopback
# fallback to the network-wide join list.
#name = My world server
public = false

#[transport]
#address = https://yourdomain:4433

#[tls]
#certificate = /etc/ssl/certs/yourdomain.pem
#key = /etc/ssl/private/yourdomain.pem

#[acme]
#hosts = yourdomain
