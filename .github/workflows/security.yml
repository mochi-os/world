name: Security

# Vulnerability scanning, mirroring core's workflow of the same name (same
# schedule, severity, tools). The container scan is schedule-only: base-image
# CVEs appear without a commit, and it needs a slow cross-arch build.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 04:37 UTC. Off the hour, and off core's :17, so the two
    # repositories' scans do not contend for the same runners.
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The go.mod toolchain directive is the floor; this only has to be
          # new enough to honour it.
          go-version: '1.25'

      - name: Native compile check (go vet)
        # govulncheck has to load every package to say anything, and a file
        # that breaks the native package graph - a browser-only file missing
        # its js && wasm constraint - left it unable to pass on any push.
        # Failing here names that cause rather than disabling the scan below.
        run: go vet ./...

      - name: Vulnerability scan (govulncheck)
        # Reports only vulnerabilities this code can actually reach, by
        # building the call graph rather than comparing module versions, so a
        # failure here is a real exposure and not advisory noise. The make
        # target carries the pinned version, so this and a local scan agree.
        run: make vulnerability-scan

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency scan (Trivy)
        # Complements govulncheck: no reachability analysis, but sees every
        # module in the graph. The make target pins the image by digest.
        run: make dependency-scan

  container:
    # Scheduled and manual only: needs the full cross-arch build, and its
    # findings come from the base image rather than from any change in a PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Container scan (Trivy)
        # Builds the image and scans it from a saved file, the same target a
        # local scan runs, so a finding accepted locally is accepted here too.
        run: make docker-scan
